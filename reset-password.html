<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer contraseña · Tawanki</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d631b" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="min-h-screen bg-[#F4EFE2] flex items-center justify-center p-5">
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <main class="w-full max-w-md bg-[#FBF8F0] rounded-2xl border border-[#C9BC9A]/50 shadow-xl overflow-hidden">
        <div class="bg-[#0d631b] px-6 py-5 text-white">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined">lock_reset</span>
                <h1 class="font-extrabold text-lg">Nueva contraseña</h1>
            </div>
            <p class="text-[11px] text-white/80 mt-1">Elige una contraseña segura de al menos 8 caracteres.</p>
        </div>

        <form id="form-reset" onsubmit="handleReset(event)" class="p-6 space-y-3 text-xs">
            <div>
                <label for="new-password" class="block font-bold mb-1">Contraseña nueva *</label>
                <input id="new-password" type="password" required minlength="8" autocomplete="new-password"
                    placeholder="Mínimo 8 caracteres"
                    class="w-full bg-[#F4EFE2] border border-[#C9BC9A]/50 rounded-xl px-3 py-2.5 text-xs outline-none focus:ring-2 focus:ring-[#0d631b]/20 focus:border-[#0d631b]" />
            </div>
            <div>
                <label for="confirm-password" class="block font-bold mb-1">Confirmar contraseña *</label>
                <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password"
                    placeholder="Repite la contraseña"
                    class="w-full bg-[#F4EFE2] border border-[#C9BC9A]/50 rounded-xl px-3 py-2.5 text-xs outline-none focus:ring-2 focus:ring-[#0d631b]/20 focus:border-[#0d631b]" />
            </div>

            <p id="reset-status" class="hidden text-[11px] rounded-xl p-3 border"></p>

            <button type="submit" id="btn-reset"
                class="w-full py-2.5 rounded-xl bg-[#0d631b] hover:bg-[#3D7A3D] text-white font-bold text-xs transition-colors">
                Guardar contraseña
            </button>

            <a href="index.html" class="block text-center text-[11px] text-[#6B5E47] hover:text-[#0d631b] font-semibold pt-1">
                Volver al inicio
            </a>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
    <script src="supabase-config.js"></script>
    <script>
        let recoveryReady = false;

        // Supabase procesa el token del enlace de recuperación desde el hash.
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
                recoveryReady = true;
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash || '';
            if (hash.includes('error_description')) {
                const params = new URLSearchParams(hash.replace(/^#/, ''));
                setStatus('El enlace expiró o no es válido. Solicita uno nuevo.', 'error');
                return;
            }

            const { data } = await supabaseClient.auth.getSession();
            recoveryReady = Boolean(data?.session);
            if (!recoveryReady) {
                setStatus('Enlace inválido o expirado. Solicita un nuevo correo de recuperación.', 'error');
            }
        });

        function setStatus(message, type) {
            const el = document.getElementById('reset-status');
            el.textContent = message;
            el.className = type === 'error'
                ? 'text-[11px] rounded-xl p-3 border bg-red-50 text-red-700 border-red-200'
                : 'text-[11px] rounded-xl p-3 border bg-green-50 text-green-700 border-green-200';
        }

        async function handleReset(e) {
            e.preventDefault();

            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password.length < 8) {
                setStatus('La contraseña debe tener al menos 8 caracteres.', 'error');
                return;
            }
            if (password !== confirm) {
                setStatus('Las contraseñas no coinciden.', 'error');
                return;
            }

            const button = document.getElementById('btn-reset');
            button.disabled = true;
            button.textContent = 'Guardando…';

            const { error } = await authService.updatePassword(password);

            button.disabled = false;
            button.textContent = 'Guardar contraseña';

            if (error) {
                setStatus(error.message || 'No se pudo actualizar la contraseña. Solicita un enlace nuevo.', 'error');
                return;
            }

            setStatus('Contraseña actualizada. Redirigiendo al inicio de sesión…', 'success');
            await authService.signOut().catch(() => {});
            setTimeout(() => window.location.replace('index.html'), 1400);
        }
    </script>
</body>

</html>
