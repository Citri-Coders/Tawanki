<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#d4a65a"/>
    </radialGradient>
    <linearGradient id="puroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3310"/>
      <stop offset="30%" stop-color="#8b5e3c"/>
      <stop offset="60%" stop-color="#7a4f2d"/>
      <stop offset="100%" stop-color="#3d1f08"/>
    </linearGradient>
    <linearGradient id="puroGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b4423"/>
      <stop offset="50%" stop-color="#9c6f42"/>
      <stop offset="100%" stop-color="#4a2d10"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8860a"/>
      <stop offset="100%" stop-color="#e6a020"/>
    </linearGradient>
    <radialGradient id="hojaGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5d8a3c"/>
      <stop offset="100%" stop-color="#2d5520"/>
    </radialGradient>
    <linearGradient id="humoGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#aaaaaa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo suave -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="12"/>

  <!-- Hoja de tabaco decorativa (fondo) -->
  <ellipse cx="310" cy="230" rx="90" ry="50" fill="url(#hojaGrad)" opacity="0.35" transform="rotate(-30 310 230)"/>
  <line x1="310" y1="230" x2="260" y2="195" stroke="#2d5520" stroke-width="1.5" opacity="0.4"/>
  <line x1="310" y1="230" x2="295" y2="190" stroke="#2d5520" stroke-width="1" opacity="0.3"/>
  <line x1="310" y1="230" x2="330" y2="188" stroke="#2d5520" stroke-width="1" opacity="0.3"/>
  <line x1="310" y1="230" x2="350" y2="200" stroke="#2d5520" stroke-width="1" opacity="0.3"/>

  <!-- Hoja de tabaco decorativa (esquina izq) -->
  <ellipse cx="80" cy="80" rx="70" ry="40" fill="url(#hojaGrad)" opacity="0.25" transform="rotate(20 80 80)"/>
  <line x1="80" y1="80" x2="130" y2="65" stroke="#2d5520" stroke-width="1.2" opacity="0.3"/>

  <!-- Puro 1 (grande, horizontal) -->
  <g transform="rotate(-15 200 155)">
    <!-- Cuerpo del puro -->
    <rect x="60" y="145" width="250" height="22" rx="11" fill="url(#puroGrad)"/>
    <!-- Venas/textura del puro -->
    <line x1="80" y1="147" x2="300" y2="150" stroke="#3d1f08" stroke-width="0.6" opacity="0.4"/>
    <line x1="90" y1="162" x2="295" y2="165" stroke="#3d1f08" stroke-width="0.5" opacity="0.3"/>
    <line x1="120" y1="148" x2="118" y2="166" stroke="#6b4423" stroke-width="0.5" opacity="0.3"/>
    <line x1="160" y1="147" x2="158" y2="166" stroke="#6b4423" stroke-width="0.5" opacity="0.3"/>
    <line x1="200" y1="147" x2="198" y2="166" stroke="#6b4423" stroke-width="0.5" opacity="0.3"/>
    <line x1="240" y1="147" x2="238" y2="166" stroke="#6b4423" stroke-width="0.5" opacity="0.3"/>
    <!-- Cabeza redondeada (izquierda) -->
    <ellipse cx="71" cy="156" rx="11" ry="11" fill="#3d1f08"/>
    <!-- Vitola (anillo) -->
    <rect x="195" y="145" width="20" height="22" rx="2" fill="url(#capGrad)" opacity="0.85"/>
    <text x="205" y="160" font-family="Georgia,serif" font-size="5" fill="#5a3310" text-anchor="middle" font-weight="bold">TAWANKI</text>
    <!-- Punta encendida -->
    <ellipse cx="310" cy="156" rx="10" ry="11" fill="#2a0e02"/>
    <ellipse cx="315" cy="156" rx="5" ry="8" fill="#c0392b" opacity="0.7"/>
    <ellipse cx="317" cy="156" rx="3" ry="5" fill="#e67e22" opacity="0.9"/>
    <ellipse cx="318" cy="156" rx="1.5" ry="3" fill="#f1c40f"/>
  </g>

  <!-- Puro 2 (más pequeño, inclinado diferente) -->
  <g transform="rotate(10 200 185)">
    <rect x="90" y="175" width="180" height="16" rx="8" fill="url(#puroGrad2)"/>
    <line x1="105" y1="177" x2="260" y2="179" stroke="#3d1f08" stroke-width="0.5" opacity="0.35"/>
    <line x1="150" y1="176" x2="148" y2="190" stroke="#6b4423" stroke-width="0.4" opacity="0.3"/>
    <line x1="200" y1="176" x2="198" y2="190" stroke="#6b4423" stroke-width="0.4" opacity="0.3"/>
    <ellipse cx="98" cy="183" rx="8" ry="8" fill="#3d1f08"/>
    <!-- Vitola 2 -->
    <rect x="168" y="175" width="14" height="16" rx="2" fill="#c8860a" opacity="0.8"/>
    <ellipse cx="270" cy="183" rx="8" ry="8" fill="#2a0e02"/>
    <ellipse cx="274" cy="183" rx="4" ry="6" fill="#c0392b" opacity="0.6"/>
    <ellipse cx="276" cy="183" rx="2" ry="4" fill="#e67e22" opacity="0.8"/>
  </g>

  <!-- Humo (puro grande) -->
  <path d="M 272 128 Q 268 118 274 108 Q 280 98 275 88" stroke="url(#humoGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 268 125 Q 262 113 268 101 Q 274 89 268 78" stroke="url(#humoGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Texto decorativo -->
  <text x="200" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5a3310" text-anchor="middle" font-weight="bold" letter-spacing="2">PUROS ARTESANALES</text>
  <text x="200" y="284" font-family="Arial, sans-serif" font-size="9" fill="#8b5e3c" text-anchor="middle" letter-spacing="1">NICARAGUA · JALAPA</text>

  <!-- Estrellas decorativas pequeñas -->
  <text x="88" y="273" font-size="8" fill="#c8860a">★</text>
  <text x="304" y="273" font-size="8" fill="#c8860a">★</text>
</svg>
