    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #2e7d32 0%, #4CAF50 100%);
            min-height: 100vh;
            background-image: url(Mosaico\ NIC.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.8;
        }

<body class="flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop text-on-primary">
    <main class="flex-grow flex flex-col items-center justify-center w-full max-w-md z-10">
        <div class="bg-surface-white rounded-xl shadow-lg p-space-8 w-full flex flex-col gap-space-8">
            <!-- Header / Logo inside Card -->
            <div class="text-center flex flex-col items-center gap-space-4">
                <div
                    class="w-24 h-24 bg-green-light-bg rounded-full flex items-center justify-center shadow-md transform transition-transform hover:scale-105 duration-300">
                    <span class="material-symbols-outlined text-primary text-5xl"
                        style="font-variation-settings: 'FILL' 1;">
                        handshake
                    </span>
                </div>
                <div>
                    <h1 class="font-headline-h1 text-headline-h1 text-primary mb-space-2 tracking-tight">
                        Wantrade
                    </h1>
                    <p class="font-body-md text-body-md text-text-muted max-w-xs mx-auto">
                        Conectando pequeños negocios con el turismo de Nicaragua
                    </p>
                </div>
            </div>
            <!-- Role Selector Buttons -->
            <div class="w-full flex flex-col gap-space-3">
                <a href="auth_intur.html"
                    class="w-full bg-surface-bright hover:bg-green-light-bg active:scale-95 transition-all duration-200 ease-in-out rounded-xl p-space-4 flex items-center gap-space-4 group border-2 border-transparent hover:border-primary-fixed-dim cursor-pointer text-decoration-none shadow-xs hover:shadow-md">
                    <div
                        class="w-12 h-12 rounded-lg bg-surface-white flex items-center justify-center group-hover:bg-primary-container transition-colors duration-200 shadow-sm">
                        <span class="text-2xl">🏛️</span>
                    </div>
                    <div class="flex-grow text-left">
                        <span class="font-headline-h3 text-headline-h3 text-primary block font-bold">Soy INTUR</span>
                        <span class="font-label-sm text-label-sm text-text-muted">Administración y métricas</span>
                    </div>
                    <span
                        class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">
                        arrow_forward
                    </span>
                </a>
                <a href="auth_productor.html"
                    class="w-full bg-surface-bright hover:bg-green-light-bg active:scale-95 transition-all duration-200 ease-in-out rounded-xl p-space-4 flex items-center gap-space-4 group border-2 border-transparent hover:border-primary-fixed-dim cursor-pointer text-decoration-none shadow-xs hover:shadow-md">
                    <div
                        class="w-12 h-12 rounded-lg bg-surface-white flex items-center justify-center group-hover:bg-primary-container transition-colors duration-200 shadow-sm">
                        <span class="text-2xl">🧑‍🌾</span>
                    </div>
                    <div class="flex-grow text-left">
                        <span class="font-headline-h3 text-headline-h3 text-primary block font-bold">Soy Productor
                            Local</span>
                        <span class="font-label-sm text-label-sm text-text-muted">Ofrece tus productos o
                            servicios</span>
                    </div>
                    <span
                        class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">
                        arrow_forward
                    </span>
                </a>
                <a href="auth_empresa.html"
                    class="w-full bg-surface-bright hover:bg-green-light-bg active:scale-95 transition-all duration-200 ease-in-out rounded-xl p-space-4 flex items-center gap-space-4 group border-2 border-transparent hover:border-primary-fixed-dim cursor-pointer text-decoration-none shadow-xs hover:shadow-md">
                    <div
                        class="w-12 h-12 rounded-lg bg-surface-white flex items-center justify-center group-hover:bg-primary-container transition-colors duration-200 shadow-sm">
                        <span class="text-2xl">🏨</span>
                    </div>
                    <div class="flex-grow text-left">
                        <span class="font-headline-h3 text-headline-h3 text-primary block font-bold">Soy Empresa
                            Turística</span>
                        <span class="font-label-sm text-label-sm text-text-muted">Encuentra proveedores locales</span>
                    </div>
                    <span
                        class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">
                        arrow_forward
                    </span>
                </a>
            </div>

        </div>
    </main>
    <!-- Footer -->
    <footer class="w-full text-center mt-space-8 pb-space-4 z-10">
        <p class="font-label-sm text-label-sm text-green-light-bg opacity-75">
            Rally Innova 2026
        </p>
    </footer>

    <!-- Supabase SDK + Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // Si hay sesión activa, ofrecer acceso rápido sin secuestrar la navegación
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { user, profile } = await authService.getCurrentUser();
                if (user && profile && profile.rol) {
                    const roleRedirects = {
                        'intur': { name: 'Funcionario INTUR', url: 'dashboard INTUR.html', icon: '🏛️' },
                        'productor': { name: 'Productor Local', url: 'perfil-productor.html', icon: '🧑‍🌾' },
                        'empresa': { name: 'Empresa Turística', url: 'proveedores.html', icon: '🏨' }
                    };
                    const info = roleRedirects[profile.rol];
                    if (info) {
                        const container = document.querySelector('main .max-w-md');
                        if (container) {
                            const banner = document.createElement('div');
                            banner.className = "mb-4 p-3 bg-white/95 backdrop-blur-sm rounded-xl shadow-lg border border-primary/30 flex items-center justify-between text-xs animate-in fade-in";
                            banner.innerHTML = `
                                <div class="flex items-center gap-2 overflow-hidden text-left">
                                    <span class="text-lg">${info.icon}</span>
                                    <div class="truncate">
                                        <p class="font-bold text-on-surface truncate">${profile.nombre_completo || 'Usuario'}</p>
                                        <p class="text-[10px] text-primary font-semibold">Sesión activa como ${info.name}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <a href="${info.url}" class="px-2.5 py-1.5 bg-primary hover:bg-surface-tint text-white font-bold rounded-lg transition-all text-[11px]">
                                        Entrar
                                    </a>
                                    <button onclick="authService.signOut().then(() => window.location.reload())" title="Cerrar sesión" class="px-2 py-1.5 bg-surface-bright hover:bg-error-container text-text-muted hover:text-error-red font-bold rounded-lg transition-all text-[11px]">
                                        Salir
                                    </button>
                                </div>
                            `;
                            container.insertBefore(banner, container.firstChild);
                        }
                    }
                }
            } catch (e) {}
        });
    </script>
</body>

</html>
