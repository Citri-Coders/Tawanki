<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Acceso Empresa Turística · Tawanki</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d631b" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/tailwind.css" />
    <!-- Hoja de estilos compilada -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(13, 99, 27, 0.38) 0%, rgba(15, 23, 42, 0.48) 100%), url('assets/mosaico-nic.jpg') center / cover no-repeat fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
            @keyframes tabFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-pane {
            animation: tabFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-4 sm:p-6 text-text-main min-h-screen">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <main class="w-full max-w-md my-auto">
        <!-- Auth Card -->
        <div
            class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-6 sm:p-8 border border-white/40 flex flex-col gap-6">

            <!-- Header with Back Button -->
            <div class="flex items-center justify-between border-b border-outline-variant/30 pb-4">
                <a href="index.html"
                    class="flex items-center gap-1.5 text-xs font-semibold text-text-muted hover:text-primary transition-colors">
                    <span class="material-symbols-outlined text-lg">arrow_back</span>
                    <span>Volver a Roles</span>
                </a>
                <span
                    class="inline-flex items-center gap-1 bg-blue-light-bg text-primary text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-primary/20">
                    <span class="material-symbols-outlined text-xs">storefront</span> Portal Empresas & Negocios
                </span>
            </div>

            <!-- Role Branding -->
            <div class="text-center flex flex-col items-center gap-2">
                <div
                    class="w-16 h-16 bg-blue-100/80 text-blue-800 rounded-2xl flex items-center justify-center shadow-xs border border-blue-200/60">
                    <span class="material-symbols-outlined text-3xl">storefront</span>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-primary tracking-tight">Empresas & Negocios</h1>
                    <p class="text-xs text-text-muted mt-0.5">Encuentra proveedores locales directos para tu hotel o restaurante</p>
                </div>
            </div>

            <!-- Tabs: Iniciar Sesión / Registro -->
            <div class="flex bg-surface-bright p-1 rounded-xl border border-outline-variant/40 text-xs font-bold">
                <button onclick="switchAuthTab('login')" id="tab-login-btn"
                    class="flex-1 py-2 rounded-lg bg-white text-primary shadow-sm transition-all text-center">
                    Iniciar Sesión
                </button>
                <button onclick="switchAuthTab('register')" id="tab-register-btn"
                    class="flex-1 py-2 rounded-lg text-text-muted hover:text-text-main transition-all text-center">
                    Registrar Empresa
                </button>
            </div>

            <!-- Form: Iniciar Sesión Empresa -->
            <form id="form-login" onsubmit="handleLogin(event)" class="tab-pane space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-text-main mb-1.5">Correo Corporativo *</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-2.5 text-text-muted text-lg">mail</span>
                        <input type="email" id="login-email" required placeholder="compras@hotelgranada.com"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl pl-9 pr-3 py-2.5 text-xs text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" />
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="font-bold text-text-main">Contraseña *</label>
                        <button type="button" onclick="solicitarRecuperacion()"
                            class="text-[11px] text-primary hover:underline font-semibold">¿Olvidaste tu clave?</button>
                    </div>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-2.5 text-text-muted text-lg">lock</span>
                        <input type="password" id="login-password" required minlength="8" autocomplete="current-password"
                            placeholder="••••••••••••"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl pl-9 pr-3 py-2.5 text-xs text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" />
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember-me" checked
                        class="rounded text-primary focus:ring-primary h-4 w-4 border-outline-variant/50" />
                    <label for="remember-me" class="text-text-muted text-[11px] cursor-pointer">Recordar datos de
                        acceso</label>
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-primary-container active:scale-[0.99] text-white font-bold py-3 rounded-xl shadow-md hover:shadow transition-all flex items-center justify-center gap-2 text-sm mt-2">
                    <span>Ingresar al Portal de Compras</span>
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
                </button>
            </form>

            <!-- Form: Registro de Empresa Turística -->
            <form id="form-register" onsubmit="handleRegister(event)" class="tab-pane hidden space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-text-main mb-1">Nombre Comercial de la Empresa *</label>
                    <input type="text" id="reg-name" required
                        placeholder="Ej: Hotel Granada Suites / Restaurante El Muelle"
                        class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-text-main mb-1">Tipo de Negocio *</label>
                        <select id="reg-tipo" required
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                            <option value="Hotel">Hotel / Resort</option>
                            <option value="Restaurante">Restaurante / Bar</option>
                            <option value="Eco_Lodge">Eco-Lodge / Finca</option>
                            <option value="Tour_Operador">Tour Operador</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-text-main mb-1">Departamento *</label>
                        <select id="reg-depto" required
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                            <option value="">Cargando departamentos…</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-text-main mb-1">Correo Corporativo *</label>
                        <input type="email" id="reg-email" required placeholder="compras@hotelgranada.com"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                    </div>
                    <div>
                        <label class="block font-bold text-text-main mb-1">Teléfono Corporativo *</label>
                        <input type="tel" id="reg-phone" required placeholder="+505 2552-1234"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-text-main mb-1">Registro Turístico o RUC</label>
                        <input type="text" id="reg-ruc" placeholder="INTUR-RT-4920"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                    </div>
                    <div>
                        <label class="block font-bold text-text-main mb-1">Crear Contraseña *</label>
                        <input type="password" id="reg-password" required minlength="8" autocomplete="new-password"
                            placeholder="Mínimo 8 caracteres"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-text-main mb-1">Insumos que necesita tu empresa</label>
                    <input type="text" id="reg-needs"
                        placeholder="Ej: Café gourmet semanal, vajillas de barro, frutas frescas..."
                        class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-primary-container active:scale-[0.99] text-white font-bold py-2.5 rounded-xl shadow-md hover:shadow transition-all flex items-center justify-center gap-2 text-xs mt-2">
                    <span>Registrar mi Empresa Turística</span>
                    <span class="material-symbols-outlined text-base">how_to_reg</span>
                </button>
            </form>

            <div
                class="p-3 rounded-xl bg-blue-light-bg/70 border border-primary/20 flex items-center gap-2 text-[11px] text-primary">
                <span class="material-symbols-outlined text-base">handshake</span>
                <span>Conecta directamente con productores locales sin intermediarios y con trazabilidad
                    garantizada.</span>
            </div>
        </div>
    </main>

    <!-- Supabase SDK + Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
    <script src="supabase-config.js"></script>

    <script>
        const PROVEEDORES_URL = 'proveedores.html';

        // Sesión de empresa ya activa → ir directo al directorio.
        (async () => {
            const result = await authService.getCurrentUser();
            if (result.user && result.profile && result.profile.rol === 'empresa' && result.profile.activo !== false) {
                window.location.replace(PROVEEDORES_URL);
            }
        })();

        document.addEventListener('DOMContentLoaded', cargarDepartamentos);

        function switchAuthTab(tab) {
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');

            if (tab === 'login') {
                loginBtn.className = "flex-1 py-2 rounded-lg bg-white text-primary shadow-sm transition-all text-center font-bold";
                regBtn.className = "flex-1 py-2 rounded-lg text-text-muted hover:text-text-main transition-all text-center";
                loginForm.classList.remove('hidden');
                loginForm.classList.remove('tab-pane');
                void loginForm.offsetWidth;
                loginForm.classList.add('tab-pane');
                regForm.classList.add('hidden');
            } else {
                regBtn.className = "flex-1 py-2 rounded-lg bg-white text-primary shadow-sm transition-all text-center font-bold";
                loginBtn.className = "flex-1 py-2 rounded-lg text-text-muted hover:text-text-main transition-all text-center";
                regForm.classList.remove('hidden');
                regForm.classList.remove('tab-pane');
                void regForm.offsetWidth;
                regForm.classList.add('tab-pane');
                loginForm.classList.add('hidden');
            }
        }

        async function cargarDepartamentos() {
            const select = document.getElementById('reg-depto');
            if (!select) return;

            const { data: deptos, error } = await catalogoBaseService.getDepartamentos();

            select.replaceChildren();
            const first = document.createElement('option');
            first.value = '';
            first.textContent = deptos?.length ? 'Selecciona tu departamento' : 'Sin departamentos configurados';
            select.appendChild(first);

            for (const depto of deptos || []) {
                const option = document.createElement('option');
                option.value = String(depto.id);
                option.textContent = depto.nombre;
                select.appendChild(option);
            }

            if (error) {
                console.error('Error cargando departamentos:', error);
                showToast('No se pudieron cargar los departamentos. Recarga la página.', 'error');
            }
        }

        async function solicitarRecuperacion() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                showToast('Escribe primero tu correo corporativo.', 'warning');
                document.getElementById('login-email').focus();
                return;
            }

            const { error } = await authService.resetPassword(email);
            if (error) {
                showToast('No se pudo enviar el correo: ' + (error.message || 'intenta de nuevo'), 'error');
                return;
            }
            showToast('Si el correo está registrado, recibirás un enlace de recuperación.', 'success');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            showToast('Verificando cuenta empresarial...', 'info');

            const { error } = await authService.signIn({ email, password });
            if (error) {
                console.error("Error en signIn:", error);
                showToast('Credenciales inválidas. Verifica tu correo y contraseña.', 'error');
                return;
            }

            const { profile, error: profileError } = await authService.getCurrentUser();
            if (profileError || !profile) {
                showToast('Tu cuenta no tiene perfil asociado. Contacta a INTUR.', 'error');
                await authService.signOut();
                return;
            }

            if (profile.activo === false) {
                showToast('Tu cuenta está desactivada. Contacta a INTUR.', 'error');
                await authService.signOut();
                return;
            }

            if (profile.rol !== 'empresa') {
                showToast('Esta cuenta no pertenece al rol de Empresa Turística.', 'error');
                await authService.signOut();
                return;
            }

            // Recupera la ficha si el correo se confirmó después del registro.
            const { data: empresa } = await empresasService.getEmpresaByProfileId(profile.id);
            if (!empresa) {
                const { error: ensureErr } = await empresasService.ensureEmpresaRecord();
                if (ensureErr) {
                    console.warn('No se pudo crear la ficha de empresa:', ensureErr);
                    showToast('Tu ficha de empresa está incompleta. Contacta a INTUR.', 'warning');
                }
            }

            showToast('¡Autenticado con éxito! Redirigiendo a proveedores...', 'success');
            setTimeout(() => window.location.replace(PROVEEDORES_URL), 700);
        }

        async function handleRegister(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg-name').value.trim();
            const tipo = document.getElementById('reg-tipo').value;
            const deptoId = document.getElementById('reg-depto').value;
            const email = document.getElementById('reg-email').value.trim();
            const ruc = document.getElementById('reg-ruc').value.trim();
            const telefono = document.getElementById('reg-phone').value.trim();
            const necesidades = document.getElementById('reg-needs').value.trim();
            const password = document.getElementById('reg-password').value;

            if (nombre.length < 3) {
                showToast('Escribe el nombre comercial de tu empresa.', 'error');
                return;
            }
            if (!deptoId) {
                showToast('Selecciona el departamento de tu empresa.', 'error');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showToast('Correo corporativo inválido.', 'error');
                return;
            }
            if (!/^[+0-9()\s-]{7,20}$/.test(telefono)) {
                showToast('Teléfono inválido. Usa el formato +505 2552-1234.', 'error');
                return;
            }
            if (password.length < 8) {
                showToast('La contraseña debe tener al menos 8 caracteres.', 'error');
                return;
            }

            showToast('Registrando empresa...', 'info');

            // Evita registrar sobre una sesión existente.
            await supabaseClient.auth.signOut();

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        nombre_completo: nombre.slice(0, 120),
                        rol: 'empresa',
                        telefono,
                        departamento_id: deptoId,
                        tipo,
                        necesidades: necesidades.slice(0, 1000),
                        ruc: ruc.slice(0, 80)
                    }
                }
            });

            if (error) {
                console.error("Error al registrar empresa:", error);
                showToast('Error al registrar: ' + (error.message || 'intenta de nuevo'), 'error');
                return;
            }

            const { data: authData } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (!authData?.session) {
                showToast('¡Empresa registrada! Confirma tu correo y luego inicia sesión.', 'success');
                setTimeout(() => {
                    switchAuthTab('login');
                    document.getElementById('login-email').value = email;
                }, 1800);
                return;
            }

            const userId = authData.user.id;

            // El perfil lo crea el trigger. Aquí solo la ficha de empresa.
            const { error: empErr } = await empresasService.upsertEmpresa({
                profile_id: userId,
                nombre_comercial: nombre.slice(0, 120),
                tipo,
                departamento_id: deptoId,
                registro_turistico_intur: ruc || null,
                telefono_corporativo: telefono,
                requerimientos_principales: necesidades
            });

            if (empErr) {
                console.error("Error insertando en tabla empresas_turisticas:", empErr);
                showToast('Empresa creada, pero no se pudo guardar la ficha: ' + (empErr.message || 'completa tu perfil'), 'warning');
                setTimeout(() => window.location.replace(PROVEEDORES_URL), 1500);
                return;
            }

            showToast('¡Empresa registrada con éxito!', 'success');
            setTimeout(() => window.location.replace(PROVEEDORES_URL), 800);
        }
    </script>

</body>

</html>
