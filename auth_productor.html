<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Acceso Productor Local · Tawanki</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d631b" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/tailwind.css" />
    <!-- Hoja de estilos compilada -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(13, 99, 27, 0.38) 0%, rgba(15, 23, 42, 0.48) 100%), url('assets/mosaico-nic.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-4 sm:p-6 text-text-main min-h-screen">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <main class="w-full max-w-md my-auto">
        <!-- Auth Card -->
        <div
            class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-6 sm:p-8 border border-white/40 flex flex-col gap-6">

            <!-- Header with Back Button -->
            <div class="flex items-center justify-between border-b border-outline-variant/30 pb-4">
                <a href="index.html"
                    class="flex items-center gap-1.5 text-xs font-semibold text-text-muted hover:text-primary transition-colors">
                    <span class="material-symbols-outlined text-lg">arrow_back</span>
                    <span>Volver a Roles</span>
                </a>
                <span
                    class="inline-flex items-center gap-1 bg-green-light-bg text-primary text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-primary/20">
                    <span class="material-symbols-outlined text-xs">store</span>
                    Portal de Productores
                </span>
            </div>

            <!-- Role Branding -->
            <div class="text-center flex flex-col items-center gap-2">
                <div
                    class="w-16 h-16 bg-green-light-bg rounded-2xl flex items-center justify-center shadow-inner border border-primary/20">
                    <span class="text-3xl">🧑‍🌾</span>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-primary tracking-tight">Soy Productor Local</h1>
                    <p class="text-xs text-text-muted mt-0.5">Ofrece tus cosechas, artesanías y productos al turismo
                        nacional</p>
                </div>
            </div>

            <!-- Tabs: Iniciar Sesión / Registro -->
            <div class="flex bg-surface-bright p-1 rounded-xl border border-outline-variant/40 text-xs font-bold">
                <button onclick="switchAuthTab('login')" id="tab-login-btn"
                    class="flex-1 py-2 rounded-lg bg-white text-primary shadow-sm transition-all text-center">
                    Iniciar Sesión
                </button>
                <button onclick="switchAuthTab('register')" id="tab-register-btn"
                    class="flex-1 py-2 rounded-lg text-text-muted hover:text-text-main transition-all text-center">
                    Crear mi Cuenta
                </button>
            </div>

            <!-- Form: Iniciar Sesión Productor -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-text-main mb-1.5">Correo Electrónico *</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-2.5 text-text-muted text-lg">mail</span>
                        <input type="email" id="login-email" required autocomplete="email"
                            placeholder="correo@ejemplo.com"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl pl-9 pr-3 py-2.5 text-xs text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" />
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="font-bold text-text-main">Contraseña *</label>
                        <button type="button" onclick="solicitarRecuperacion()"
                            class="text-[11px] text-primary hover:underline font-semibold">¿Olvidaste tu clave?</button>
                    </div>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-2.5 text-text-muted text-lg">lock</span>
                        <input type="password" id="login-password" required minlength="8" autocomplete="current-password"
                            placeholder="••••••••••••"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl pl-9 pr-3 py-2.5 text-xs text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" />
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember-me" checked
                        class="rounded text-primary focus:ring-primary h-4 w-4 border-outline-variant/50" />
                    <label for="remember-me" class="text-text-muted text-[11px] cursor-pointer">Mantener mi sesión
                        activa</label>
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-primary-container active:scale-[0.99] text-white font-bold py-3 rounded-xl shadow-md hover:shadow transition-all flex items-center justify-center gap-2 text-sm mt-2">
                    <span>Ingresar a mi Catálogo</span>
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
                </button>
            </form>

            <!-- Form: Registro de Nuevo Productor -->
            <form id="form-register" onsubmit="handleRegister(event)" class="hidden space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-text-main mb-1">Nombre o Nombre de Cooperativa *</label>
                    <input type="text" id="reg-name" required
                        placeholder="Ej: Finca San Antonio / Cooperativa Matagalpa"
                        class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-text-main mb-1">Departamento *</label>
                        <select id="reg-depto" required
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                            <option value="">Cargando departamentos…</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-text-main mb-1">Rubro Principal *</label>
                        <select id="reg-rubro" required
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none">
                            <option value="">Cargando rubros…</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-text-main mb-1">Correo Electrónico *</label>
                        <input type="email" id="reg-email" required placeholder="tu-cooperativa@correo.com"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                    </div>
                    <div>
                        <label class="block font-bold text-text-main mb-1">Teléfono WhatsApp *</label>
                        <input type="tel" id="reg-phone" required placeholder="+505 8888-9999"
                            class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-text-main mb-1">Crear Contraseña *</label>
                    <input type="password" id="reg-password" required minlength="8" autocomplete="new-password"
                        placeholder="Mínimo 8 caracteres"
                        class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" />
                </div>

                <div>
                    <label class="block font-bold text-text-main mb-1">Breve descripción de tus productos</label>
                    <textarea id="reg-desc" rows="2"
                        placeholder="Ej: Producimos café orgánico tostado y molido artesanalmente..."
                        class="w-full bg-surface-bright border border-outline-variant/40 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none"></textarea>
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-primary-container active:scale-[0.99] text-white font-bold py-2.5 rounded-xl shadow-md hover:shadow transition-all flex items-center justify-center gap-2 text-xs mt-2">
                    <span>Registrarme como Productor</span>
                    <span class="material-symbols-outlined text-base">how_to_reg</span>
                </button>
            </form>

            <div
                class="p-3 rounded-xl bg-green-light-bg/70 border border-primary/20 flex items-center gap-2 text-[11px] text-primary">
                <span class="material-symbols-outlined text-base">verified</span>
                <span>Al registrarte, tus productos serán promocionados ante hoteles y restaurantes verificados.</span>
            </div>
        </div>
    </main>

    <!-- Supabase SDK + Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
    <script src="supabase-config.js"></script>

    <script>
        const PERFIL_URL = 'perfil-productor.html';

        // Sesión de productor ya activa → ir directo al perfil.
        (async () => {
            const result = await authService.getCurrentUser();
            if (result.user && result.profile && result.profile.rol === 'productor' && result.profile.activo !== false) {
                window.location.replace(PERFIL_URL);
            }
        })();

        document.addEventListener('DOMContentLoaded', cargarCatalogos);

        function switchAuthTab(tab) {
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');

            if (tab === 'login') {
                loginBtn.className = "flex-1 py-2 rounded-lg bg-white text-primary shadow-sm transition-all text-center";
                regBtn.className = "flex-1 py-2 rounded-lg text-text-muted hover:text-text-main transition-all text-center";
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            } else {
                regBtn.className = "flex-1 py-2 rounded-lg bg-white text-primary shadow-sm transition-all text-center";
                loginBtn.className = "flex-1 py-2 rounded-lg text-text-muted hover:text-text-main transition-all text-center";
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function llenarSelect(select, items, placeholder) {
            if (!select) return;
            select.replaceChildren();
            const first = document.createElement('option');
            first.value = '';
            first.textContent = placeholder;
            select.appendChild(first);

            for (const item of items) {
                const option = document.createElement('option');
                option.value = String(item.id);
                option.textContent = item.nombre || String(item.id);
                select.appendChild(option);
            }
        }

        async function cargarCatalogos() {
            const deptoSelect = document.getElementById('reg-depto');
            const rubroSelect = document.getElementById('reg-rubro');

            const [deptosRes, rubrosRes] = await Promise.all([
                catalogoBaseService.getDepartamentos(),
                catalogoBaseService.getRubros()
            ]);

            const deptos = deptosRes.data || [];
            const rubros = rubrosRes.data || [];

            llenarSelect(deptoSelect, deptos, deptos.length ? 'Selecciona tu departamento' : 'Sin departamentos configurados');
            llenarSelect(rubroSelect, rubros, rubros.length ? 'Selecciona tu rubro' : 'Sin rubros configurados');

            if (deptosRes.error || rubrosRes.error) {
                console.error('Error cargando catálogos base:', deptosRes.error || rubrosRes.error);
                showToast('No se pudieron cargar departamentos/rubros. Recarga la página.', 'error');
            }
        }

        async function solicitarRecuperacion() {
            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                showToast('Escribe primero tu correo electrónico.', 'warning');
                document.getElementById('login-email').focus();
                return;
            }

            const { error } = await authService.resetPassword(email);
            if (error) {
                showToast('No se pudo enviar el correo: ' + (error.message || 'intenta de nuevo'), 'error');
                return;
            }
            showToast('Si el correo está registrado, recibirás un enlace de recuperación.', 'success');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            showToast('Validando credenciales...', 'info');

            const { error } = await authService.signIn({ email, password });
            if (error) {
                console.error("Error en signIn:", error);
                showToast('Credenciales inválidas. Verifica tu correo y contraseña.', 'error');
                return;
            }

            const { profile, error: profileError } = await authService.getCurrentUser();
            if (profileError || !profile) {
                showToast('Tu cuenta no tiene perfil asociado. Contacta a INTUR.', 'error');
                await authService.signOut();
                return;
            }

            if (profile.activo === false) {
                showToast('Tu cuenta está desactivada. Contacta a INTUR.', 'error');
                await authService.signOut();
                return;
            }

            if (profile.rol !== 'productor') {
                showToast('Esta cuenta no pertenece al perfil de Productor.', 'error');
                await authService.signOut();
                return;
            }

            // Crea el registro de productor si el correo se confirmó después del registro.
            const { error: ensureErr } = await productosService.ensureProductorRecord();
            if (ensureErr) {
                console.warn('No se pudo asegurar el registro de productor:', ensureErr);
            }

            showToast('¡Bienvenido! Cargando tu perfil...', 'success');
            setTimeout(() => window.location.replace(PERFIL_URL), 700);
        }

        async function handleRegister(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg-name').value.trim();
            const deptoId = document.getElementById('reg-depto').value;
            const rubroId = document.getElementById('reg-rubro').value;
            const email = document.getElementById('reg-email').value.trim();
            const telefono = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const descripcion = document.getElementById('reg-desc').value.trim();

            if (nombre.length < 3) {
                showToast('Escribe el nombre de tu finca, taller o cooperativa.', 'error');
                return;
            }
            if (!deptoId || !rubroId) {
                showToast('Selecciona departamento y rubro principal.', 'error');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showToast('Correo electrónico inválido.', 'error');
                return;
            }
            if (!/^[+0-9()\s-]{7,20}$/.test(telefono)) {
                showToast('Teléfono inválido. Usa el formato +505 8888-9999.', 'error');
                return;
            }
            if (password.length < 8) {
                showToast('La contraseña debe tener al menos 8 caracteres.', 'error');
                return;
            }
            if (descripcion.length > 2000) {
                showToast('La descripción no puede superar los 2000 caracteres.', 'error');
                return;
            }

            showToast('Creando cuenta de productor...', 'info');

            // Evita registrar sobre una sesión existente.
            await supabaseClient.auth.signOut();

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        nombre_completo: nombre.slice(0, 120),
                        rol: 'productor',
                        telefono,
                        departamento_id: deptoId,
                        rubro_id: rubroId,
                        descripcion
                    }
                }
            });

            if (error) {
                console.error("Error al registrar en Supabase Auth:", error);
                showToast('Error al registrar: ' + (error.message || 'intenta de nuevo'), 'error');
                return;
            }

            const { data: authData } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (!authData?.session) {
                showToast('¡Cuenta creada! Confirma tu correo y luego inicia sesión.', 'success');
                setTimeout(() => {
                    switchAuthTab('login');
                    document.getElementById('login-email').value = email;
                }, 1800);
                return;
            }

            const userId = authData.user.id;

            // El perfil lo crea el trigger de la base de datos. Aquí solo se
            // registra la ficha de productor (verificado_intur=false por trigger).
            const { error: prodErr } = await productoresService.upsertProductor({
                profile_id: userId,
                nombre_cooperativa_o_taller: nombre.slice(0, 120),
                departamento_id: deptoId,
                rubro_id: rubroId,
                descripcion,
                telefono_whatsapp: telefono
            });

            if (prodErr) {
                console.error("Error insertando en tabla productores:", prodErr);
                showToast('Cuenta creada, pero no se pudo guardar tu ficha: ' + (prodErr.message || 'completa tu perfil'), 'warning');
                setTimeout(() => window.location.replace(PERFIL_URL), 1500);
                return;
            }

            showToast('¡Cuenta de productor creada con éxito!', 'success');
            setTimeout(() => window.location.replace(PERFIL_URL), 800);
        }
    </script>

</body>

</html>
